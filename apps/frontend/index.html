<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rajputana Rawla</title>
    <script>
      /*
       * Applies the theme class before the first paint.
       *
       * This has to be blocking inline script in <head>: any JS that arrives
       * with the bundle — including the theme plugin — runs after the browser
       * has already painted a light background, which is the flash of white
       * every dark-mode app has to design around. The theme plugin owns changes
       * from here on; this only sets the initial value.
       */
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var dark =
            stored === 'dark' ||
            ((stored === null || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (_) {
          /* Private mode or blocked storage: fall back to the light theme. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
