# Rawla portal — the backend and frontend images, together, on their own network.
#
#   cp .env.example .env     # ONE file: Compose settings AND the backend's config/secrets
#   docker compose up -d     # from this directory, or `pnpm docker:up`
#
# .env does two jobs: Compose interpolates it into this file, and the backend
# container receives all of it (env_file below). Images come from
# DOCKER_REGISTRY when it is set (`docker login` to it once), otherwise from
# the local builds made by `pnpm docker:build`. See README.md.
name: ${COMPOSE_PROJECT_NAME:-rawla-portal}

services:
  backend:
    # [registry/]name:tag, each part from .env on its own — an empty
    # DOCKER_REGISTRY leaves a bare name, which resolves to the local build.
    image: ${DOCKER_REGISTRY:+${DOCKER_REGISTRY}/}${BACKEND_IMAGE:-helix-x-rawla-backend}:${BACKEND_TAG:-local}
    restart: unless-stopped
    # The same .env Compose reads: app config and secrets (JWT, mail, Stripe,
    # …) and the database choice (DB_TYPE, DATABASE_URL, DB_SSL). The backend
    # refuses to boot without JWT_SECRET, OAUTH_JWT_SECRET, CONTACT_TO_EMAIL and
    # DOCUMENTS_SIGNING_SECRET.
    env_file:
      - .env
    # Set by this topology. `environment:` overrides env_file, so only what
    # the topology decides belongs here — never DB_TYPE or DATABASE_URL, or
    # the values in .env would be silently ignored.
    environment:
      # The SQLite database, in a host folder (relative to this directory) so it
      # is a visible file: <DOCKER_VOLUME_FOLDER>/data/helix_x.db. It survives
      # `docker compose down -v`; deleting the folder is what removes it.      
      DB_PATH: ${DB_PATH:-/data/helix_x.db}
      # Uploaded documents, beside the database on the same host folder:
      # <DOCKER_VOLUME_FOLDER>/data/documents. Unused under
      # DOCUMENTS_STORAGE_DRIVER=s3.
      DOCUMENTS_LOCAL_ROOT: ${DOCUMENTS_LOCAL_ROOT:-/data/documents}
      # Requests arrive through the frontend's nginx; without this every
      # visitor shares the proxy's IP for the per-IP rate limits.
      TRUST_PROXY: "1"
    volumes:
      - ${DOCKER_VOLUME_FOLDER:-./docker-volume}/data:/data
    depends_on:
      postgres:
        condition: service_healthy
        # Only when the `postgres` profile is active; SQLite needs no service.
        required: false
    networks:
      - rawla
    # Published for /docs and debugging only — browsers reach the API through
    # the frontend. Bound to localhost by default; set BACKEND_BIND=0.0.0.0 to
    # expose it.
    ports:
      - "${BACKEND_BIND:-127.0.0.1}:${BACKEND_PORT:-3001}:3001"

  frontend:
    image: ${DOCKER_REGISTRY:+${DOCKER_REGISTRY}/}${FRONTEND_IMAGE:-helix-x-rawla-frontend}:${FRONTEND_TAG:-local}
    restart: unless-stopped
    environment:
      # nginx proxies /api here, resolving the service name on this network.
      BACKEND_UPSTREAM: http://backend:3001
    depends_on:
      backend:
        # The backend image's HEALTHCHECK passes once migrations have run and
        # the API answers /api/health.
        condition: service_healthy
    networks:
      - rawla
    ports:
      - "${FRONTEND_PORT:-8080}:80"

  # Optional PostgreSQL, started only with the `postgres` profile. In .env:
  # COMPOSE_PROFILES=postgres, DB_TYPE=postgres and
  # DATABASE_URL=postgres://<user>:<password>@postgres:5432/<db>.
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    profiles: [postgres]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rawla}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rawla}
      POSTGRES_DB: ${POSTGRES_DB:-rawla}
    # A new database is empty: apply the framework's postgres migrations, then
    # apps/backend/migrations/postgres/*.sql, by hand before the backend's
    # first start (see apps/backend/migrations/README.md).
    volumes:
      - ${DOCKER_VOLUME_FOLDER:-./docker-volume}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - rawla

networks:
  rawla:
    name: ${RAWLA_NETWORK:-rawla-net}
