# Rawla portal — the backend and frontend images, together, on their own network.
#
#   cp .env.example .env                  # registry, image tags, data folder, ports
#   cp backend.env.example backend.env    # backend config and secrets — edit it
#   docker compose up -d                  # from this directory, or `pnpm docker:up`
#
# Images come from DOCKER_REGISTRY when it is set (`docker login` to it once),
# otherwise from the local builds made by `pnpm docker:build`. Every variable
# below has a default, so .env only needs what you change. See README.md.
name: ${COMPOSE_PROJECT_NAME:-rawla-portal}

services:
  backend:
    # [registry/]name:tag, each part from .env on its own — an empty
    # DOCKER_REGISTRY leaves a bare name, which resolves to the local build.
    image: ${DOCKER_REGISTRY:+${DOCKER_REGISTRY}/}${BACKEND_IMAGE:-helix-x-rawla-backend}:${BACKEND_TAG:-local}
    restart: unless-stopped
    # App config and secrets (JWT, mail, Stripe, …). Required: the backend
    # refuses to boot without JWT_SECRET, OAUTH_JWT_SECRET and CONTACT_TO_EMAIL.
    env_file:
      - ${BACKEND_ENV_FILE:-./backend.env}
    # Fixed by this topology rather than by the operator.
    environment:
      DB_PATH: /data/helix_x.db
      # Requests arrive through the frontend's nginx; without this every
      # visitor shares the proxy's IP for the per-IP rate limits.
      TRUST_PROXY: "1"
      # From .env: start an EMPTY data folder from the image's sample database.
      SEED_SAMPLE_DB: ${SEED_SAMPLE_DB:-false}
    # The SQLite database, in a host folder (relative to this directory) so it
    # is a visible file: <DOCKER_VOLUME_FOLDER>/data/helix_x.db. It survives
    # `docker compose down -v`; deleting the folder is what removes it.
    volumes:
      - ${DOCKER_VOLUME_FOLDER:-./docker-volume}/data:/data
    networks:
      - rawla
    # Published for /docs and debugging only — browsers reach the API through
    # the frontend. Bound to localhost by default; set BACKEND_BIND=0.0.0.0 to
    # expose it.
    ports:
      - "${BACKEND_BIND:-127.0.0.1}:${BACKEND_PORT:-3001}:3001"

  frontend:
    image: ${DOCKER_REGISTRY:+${DOCKER_REGISTRY}/}${FRONTEND_IMAGE:-helix-x-rawla-frontend}:${FRONTEND_TAG:-local}
    restart: unless-stopped
    environment:
      # nginx proxies /api here, resolving the service name on this network.
      BACKEND_UPSTREAM: http://backend:3001
    depends_on:
      backend:
        # The backend image's HEALTHCHECK passes once migrations have run and
        # the API answers /api/health.
        condition: service_healthy
    networks:
      - rawla
    ports:
      - "${FRONTEND_PORT:-8080}:80"

networks:
  rawla:
    name: ${RAWLA_NETWORK:-rawla-net}
